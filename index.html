<style>
  html,body{margin:0;padding:0;min-height:100%}
  body{background:#f9fbfe;color:#283e48;font-family:Europa,Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;box-sizing:border-box}
  .card{width:100%;max-width:560px;background:#fff;border:1px solid #f5f5f5;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.03),0 1px 3px 1px rgba(0,0,0,.05);padding:56px 48px;text-align:center;box-sizing:border-box}
  .logo{height:28px;width:auto;display:block;margin:0 auto 40px}
  .tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:1.21px;text-transform:uppercase;color:#3866b0;background:#eef2fc;border-radius:2px;padding:6px 12px;margin-bottom:24px}
  h1{margin:0 0 16px;font-size:37px;line-height:1.15;font-weight:300;letter-spacing:-.5px}
  p{margin:0 0 32px;font-size:16px;line-height:1.6;font-weight:300;color:#4f4f4f}
  .btn{display:inline-block;font-size:14px;font-weight:700;letter-spacing:1.21px;text-transform:uppercase;color:#fff;text-decoration:none;background:linear-gradient(100deg,#3866b0 1.13%,#305ab7 49.7%,#2b3c7d 101.54%);border-radius:3px;padding:.625rem 2rem;line-height:24px;transition:all .3s}
  .btn:hover{opacity:.92}
  .foot{margin-top:32px;padding-top:24px;border-top:1px solid rgba(0,0,0,.12);font-size:13px;line-height:1.6;font-weight:300;color:#707070;word-break:break-word}
  a{color:#3866b0}
  a:hover{color:#003c80}
  @media (max-width:520px){.card{padding:40px 24px}h1{font-size:28px}}
</style>
